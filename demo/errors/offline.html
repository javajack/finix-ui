<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're offline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/finix.css">
<link rel="stylesheet" href="../../css/finix-widgets.css">
<script>try{var t=localStorage.getItem('fx-theme');document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');var b=localStorage.getItem('fx-brand');if(b)document.documentElement.dataset.brand=b;}catch(e){}</script>
<script defer src="../../js/finix.js"></script>
<style>
  body { min-height: 100vh; display: grid; place-items: center; padding: 2rem 1.25rem; }
  .err { max-width: 24rem; width: 100%; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 1rem; }
  .pulse { width: 3rem; height: 3rem; border-radius: 999px; display: grid; place-items: center; font-size: 1.375rem; background: var(--well); position: relative; }
  .pulse::after { content: ""; position: absolute; inset: 0; border-radius: inherit; border: 2px solid color-mix(in oklab, var(--primary) 45%, transparent); animation: off-ping 1.8s var(--ease-out) infinite; }
  @keyframes off-ping { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.7); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .pulse::after { animation: none; } }
</style>
</head>
<body>
<div class="err">
  <div class="pulse">📡</div>
  <div>
    <h1 style="margin:0;font-size:1.125rem;font-weight:650;letter-spacing:-.01em">You're offline</h1>
    <p class="fx-text-sm fx-muted" style="margin:.375rem 0 0">Your drafts are safe locally and will sync the moment the connection returns. Retrying automatically…</p>
  </div>
  <div class="fx-text-xs fx-muted" style="font-family:var(--font-mono)">next retry in <b id="retry-in" style="color:var(--foreground)">5</b>s · attempt <b id="attempt" style="color:var(--foreground)">1</b></div>
  <button class="fx-btn fx-btn--outline fx-btn--sm" id="retry-now">Retry now</button>
</div>
<script>
let n = 5, attempt = 1;
const tick = () => {
  n--;
  if (n <= 0) {
    attempt++;
    n = Math.min(30, attempt * 5);
    document.getElementById("attempt").textContent = attempt;
    if (navigator.onLine && attempt > 2) finix.toast({ title: "Back online", description: "Syncing 3 queued changes…", variant: "success" });
  }
  document.getElementById("retry-in").textContent = n;
};
setInterval(tick, 1000);
document.getElementById("retry-now").addEventListener("click", () => { n = 1; });
</script>
</body>
</html>
