<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 — Page not found</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../css/tokens.css">
<link rel="stylesheet" href="../../css/finix.css">
<link rel="stylesheet" href="../../css/finix-widgets.css">
<script>try{var t=localStorage.getItem('fx-theme');document.documentElement.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');var b=localStorage.getItem('fx-brand');if(b)document.documentElement.dataset.brand=b;}catch(e){}</script>
<script defer src="../../js/finix.js"></script>
<style>
  body { min-height: 100vh; display: grid; place-items: center; padding: 2rem 1.25rem; }
  .err { max-width: 26rem; width: 100%; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 1rem; }
  .err-code { font-family: var(--font-mono); font-size: 4.5rem; font-weight: 550; letter-spacing: -0.05em; line-height: 1; background: linear-gradient(180deg, var(--foreground), color-mix(in oklab, var(--foreground) 30%, transparent)); -webkit-background-clip: text; background-clip: text; color: transparent; }
</style>
</head>
<body>
<div class="err">
  <div class="fx-sidebar-logo" style="width:2.5rem;height:2.5rem;font-size:1.125rem;border-radius:.75rem">F</div>
  <div class="err-code">404</div>
  <div>
    <h1 style="margin:0;font-size:1.125rem;font-weight:650;letter-spacing:-.01em">This page wandered off.</h1>
    <p class="fx-text-sm fx-muted" style="margin:.375rem 0 0">The link is broken or the page moved. Search, or jump somewhere solid.</p>
  </div>
  <div class="fx-input-group" style="width:100%">
    <span class="fx-input-addon"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></span>
    <input class="fx-input" placeholder="Search docs and pages…">
  </div>
  <div class="fx-row" style="gap:.375rem;flex-wrap:wrap;justify-content:center">
    <a class="fx-btn fx-btn--outline fx-btn--sm" href="../index.html">Dashboard</a>
    <a class="fx-btn fx-btn--outline fx-btn--sm" href="../site/home.html">Homepage</a>
    <a class="fx-btn fx-btn--outline fx-btn--sm" href="../site/status.html">Status</a>
    <a class="fx-btn fx-btn--sm" href="javascript:history.back()">← Go back</a>
  </div>
</div>
</body>
</html>
